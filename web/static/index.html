<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>noticord</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="theme-color" content="#0b0f17">
  <style>
    :root {
      --bg:#0b0f17; --sidebar:#0e1320; --panel:#141a26; --panel2:#1b2333;
      --fg:#e6ebf5; --muted:#8a96ad; --accent:#5b8cff; --danger:#ff6b6b; --ok:#46d39a;
      --line:#232b3d;
    }
    * { box-sizing: border-box; }
    html, body { height:100%; overflow-x:hidden; }
    body { margin:0; background:var(--bg); color:var(--fg);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
      line-height:1.6;
      /* iOS PWA: 縦スクロール時に横へブレる/ラバーバンドするのを防ぐ */
      width:100%; max-width:100%; overscroll-behavior:none; }
    button { font:inherit; border:none; border-radius:8px; padding:8px 12px; background:var(--accent); color:#fff; cursor:pointer; }
    button.secondary { background:var(--panel2); color:var(--fg); border:1px solid #2c3650; }
    button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
    button.danger { background:transparent; color:var(--danger); border:1px solid #3a2730; }
    button:disabled { opacity:.5; cursor:default; }
    input, textarea { font:inherit; background:var(--panel2); border:1px solid #2c3650; color:var(--fg); border-radius:8px; padding:8px 10px; width:100%; }
    a { color:var(--accent); }
    .hidden { display:none !important; }
    .muted { color:var(--muted); font-size:13px; }
    .row { display:flex; gap:8px; align-items:center; }
    .grow { flex:1; min-width:0; }

    /* ---- ログイン ---- */
    #loginScreen { display:flex; align-items:center; justify-content:center; height:100%; }
    #loginScreen .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px; width:320px; max-width:90vw; }
    #loginScreen h1 { font-size:20px; margin:0 0 16px; display:flex; gap:10px; align-items:center; }
    #loginScreen img { width:28px; height:28px; }

    /* ---- アプリ本体: 2ペイン ---- */
    #app { display:grid; grid-template-columns:260px 1fr; height:100%; }

    /* サイドバー */
    .sidebar { background:var(--sidebar); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
    .sidebar .brand { padding:14px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); }
    .sidebar .brand img { width:26px; height:26px; }
    .sidebar .brand h1 { font-size:17px; margin:0; }
    .sidebar .channels { flex:1; overflow-y:auto; overflow-x:hidden; padding:8px; touch-action:pan-y; overscroll-behavior:contain; }
    .sidebar .section-label { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:8px 8px 4px; display:flex; align-items:center; }
    .channel-item { display:flex; align-items:center; gap:6px; padding:7px 8px; border-radius:6px; cursor:pointer; color:var(--muted); }
    .channel-item:hover { background:#ffffff0d; color:var(--fg); }
    .channel-item.active { background:#ffffff14; color:#fff; }
    .channel-item .hash { opacity:.6; font-weight:600; }
    .channel-item .cname { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .channel-item .badge { font-size:11px; background:var(--accent); color:#fff; border-radius:999px; padding:0 6px; min-width:18px; text-align:center; }
    .channel-item .grip { opacity:0; cursor:grab; color:var(--muted); font-size:12px; padding:0 2px; touch-action:none; }
    .channel-item:hover .grip { opacity:.5; }
    .channel-item.dragging { opacity:.4; }
    .channel-item.drop-before { box-shadow:inset 0 2px 0 var(--accent); }
    .channel-item.drop-after { box-shadow:inset 0 -2px 0 var(--accent); }
    /* Discord 風「new messages」未読仕切り */
    .new-divider { display:flex; align-items:center; gap:8px; margin:6px 0; color:var(--danger); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
    .new-divider::before { content:""; flex:1; height:1px; background:var(--danger); opacity:.6; }
    .new-divider::after { content:""; height:1px; background:var(--danger); opacity:.6; width:8px; }
    .sidebar .foot { border-top:1px solid var(--line); padding:10px; display:flex; flex-direction:column; gap:8px; }
    .sidebar .foot .row { flex-wrap:wrap; }
    .push-guide { font-size:12px; line-height:1.5; color:#ffe1a8; background:#3a2f17; border:1px solid #5c4a20; border-radius:8px; padding:8px 10px; }
    .push-guide b { color:#fff; }
    .status { font-size:12px; padding:3px 8px; border-radius:999px; background:var(--panel2); }
    .status.ok { color:var(--ok); }
    .status.off { color:var(--muted); }

    /* メイン */
    .main { display:flex; flex-direction:column; min-width:0; min-height:0; }
    .main .header { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); }
    .main .header .title { font-weight:700; font-size:16px; display:flex; align-items:center; gap:4px; }
    .main .header .topic { color:var(--muted); font-size:13px; border-left:1px solid var(--line); padding-left:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .timeline { flex:1; overflow-y:auto; overflow-x:hidden; padding:16px; display:flex; flex-direction:column; gap:2px;
      /* iOS: 縦スワイプのわずかな横成分を横パンとして拾わせない */
      touch-action:pan-y; overscroll-behavior:contain; }

    /* メッセージ行(Discord風) */
    .message-row { display:flex; gap:12px; padding:8px 8px; border-radius:6px; }
    .message-row:hover { background:#ffffff08; }
    .message-row .avatar { width:40px; height:40px; border-radius:50%; flex:none; background:var(--panel2); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; overflow:hidden; }
    .message-row .avatar img { width:100%; height:100%; object-fit:cover; }
    .message-row .body { flex:1; min-width:0; }
    .message-row .meta { display:flex; align-items:baseline; gap:8px; }
    .message-row .author { font-weight:600; }
    .message-row .time { color:var(--muted); font-size:12px; }
    .message-row .del { margin-left:auto; visibility:hidden; }
    .message-row:hover .del { visibility:visible; }
    .message-row .text { word-break:break-word; }
    .message-row code { background:#0008; padding:1px 5px; border-radius:4px; font-family:ui-monospace,Menlo,monospace; font-size:.9em; }

    /* embed カード */
    .embed { background:var(--panel2); border-left:4px solid #4f545c; border-radius:4px; padding:10px 12px; margin-top:6px; max-width:520px; }
    .embed-grid { display:flex; gap:12px; }
    .embed-main { flex:1; min-width:0; }
    .embed-author { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; margin-bottom:4px; }
    .embed-author-icon { width:20px; height:20px; border-radius:50%; }
    .embed-title { font-weight:700; margin-bottom:4px; }
    .embed-title a { text-decoration:none; }
    .embed-desc { font-size:14px; color:#dbe0ea; word-break:break-word; }
    .embed-fields { display:grid; grid-template-columns:1fr; gap:8px; margin-top:8px; }
    .embed-field-name { font-weight:600; font-size:13px; }
    .embed-field-value { font-size:14px; color:#dbe0ea; }
    @media (min-width:480px) { .embed-fields { grid-template-columns:repeat(3,1fr); } .embed-field:not(.inline) { grid-column:1 / -1; } }
    .embed-image { max-width:100%; border-radius:6px; margin-top:8px; display:block; }
    .embed-thumb { width:72px; height:72px; object-fit:cover; border-radius:6px; flex:none; }
    .embed-footer { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); margin-top:8px; }
    .embed-footer-icon { width:18px; height:18px; border-radius:50%; }

    .center { text-align:center; color:var(--muted); padding:40px 0; }

    /* モーダル */
    .modal-bg { position:fixed; inset:0; background:#000a; display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
    .modal { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; width:520px; max-width:95vw; max-height:90vh; overflow-y:auto; }
    .modal h2 { font-size:16px; margin:0 0 14px; }
    .modal .field { margin-bottom:12px; }
    .modal .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
    .url { font-family:ui-monospace,Menlo,monospace; font-size:12px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; word-break:break-all; margin:6px 0; }
    .wh { border-top:1px solid var(--line); padding:10px 0; }
    .wh:first-of-type { border-top:none; }

    /* 通知設定ボトムシート(下から出る) */
    .sheet-bg { align-items:flex-end; }
    .sheet { background:var(--panel); border:1px solid var(--line); border-bottom:none;
      border-radius:14px 14px 0 0; padding:18px; padding-bottom:calc(18px + env(safe-area-inset-bottom));
      width:100%; max-width:560px; animation:sheet-up .22s ease; }
    @keyframes sheet-up { from { transform:translateY(100%); } to { transform:translateY(0); } }
    .sheet-head { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
    .sheet-head h2 { font-size:16px; margin:0; }
    /* トグルスイッチ */
    .switch-row { display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:12px 2px; cursor:pointer; }
    .switch { appearance:none; -webkit-appearance:none; flex:none; width:46px; height:26px; margin:0;
      border-radius:999px; background:var(--panel2); border:1px solid #2c3650; position:relative;
      cursor:pointer; transition:background .15s, border-color .15s; }
    .switch::after { content:""; position:absolute; top:2px; left:2px; width:20px; height:20px;
      border-radius:50%; background:var(--muted); transition:transform .15s, background .15s; }
    .switch:checked { background:var(--accent); border-color:var(--accent); }
    .switch:checked::after { transform:translateX(20px); background:#fff; }

    /* トースト */
    .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid #2c3650; padding:10px 16px; border-radius:10px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:60; white-space:pre-line; max-width:90vw; font-size:13px; }
    .toast.show { opacity:1; }

    /* モバイル: サイドバーをドロワー化 */
    .mobile-only { display:none; }
    /* ドロワー開時の背面スクリム(右側の余白タップで閉じる/メイン誤操作を防ぐ) */
    #drawerScrim { display:none; }
    @media (max-width:720px) {
      #app { grid-template-columns:1fr; }
      .sidebar { position:fixed; inset:0 40% 0 0; z-index:40; transform:translateX(-100%); transition:transform .2s; }
      #app.drawer-open .sidebar { transform:translateX(0); }
      #app.drawer-open #drawerScrim { display:block; position:fixed; inset:0; z-index:39; background:#0006; }
      .mobile-only { display:inline-flex; }
    }
  </style>
</head>
<body>
  <!-- ログイン -->
  <div id="loginScreen" class="hidden">
    <div class="card">
      <h1><img src="/icon.svg" alt="">noticord</h1>
      <div class="field">
        <input id="password" type="password" placeholder="パスワード" autocomplete="current-password" data-i18n-ph="login.password_ph">
      </div>
      <button id="loginBtn" style="width:100%" data-i18n="login.button">ログイン</button>
      <p id="loginError" class="muted"></p>
    </div>
  </div>

  <!-- アプリ -->
  <div id="app" class="hidden">
    <!-- ドロワー開時に右側の余白を覆うスクリム(タップで閉じる) -->
    <div id="drawerScrim"></div>
    <!-- サイドバー -->
    <aside class="sidebar">
      <div class="brand">
        <img src="/icon.svg" alt="">
        <h1 class="grow">noticord</h1>
        <span id="notifDot" class="status off" data-i18n="notif.label">通知</span>
      </div>
      <div class="channels">
        <div class="section-label">
          <span class="grow" data-i18n="sidebar.channels">チャンネル</span>
          <button id="addChannelBtn" class="ghost" style="padding:2px 8px" title="チャンネルを追加" data-i18n-title="sidebar.add_channel">＋</button>
        </div>
        <div id="channelList"></div>
      </div>
      <div class="foot">
        <button id="notifSettingsBtn" class="secondary grow">🔔 <span data-i18n="notif.settings">通知設定</span></button>
        <div class="row">
          <span class="muted grow" id="footNote"></span>
          <button id="logoutBtn" class="ghost hidden" data-i18n="logout">ログアウト</button>
        </div>
      </div>
    </aside>

    <!-- メイン -->
    <main class="main">
      <div class="header">
        <button id="menuBtn" class="ghost mobile-only" title="チャンネル" data-i18n-title="header.menu">☰</button>
        <span class="title"><span class="hash" style="opacity:.5">#</span><span id="curChannelName">—</span></span>
        <span id="curTopic" class="topic"></span>
        <span class="grow"></span>
        <button id="settingsBtn" class="ghost" title="チャンネル設定" data-i18n-title="header.settings">⚙</button>
      </div>
      <div id="timeline" class="timeline">
        <p class="center" data-i18n="timeline.select_channel">チャンネルを選択してください</p>
      </div>
    </main>
  </div>

  <!-- チャンネル追加モーダル -->
  <div id="addChannelModal" class="modal-bg hidden">
    <div class="modal">
      <h2 data-i18n="addch.title">チャンネルを追加</h2>
      <div class="field">
        <label data-i18n="addch.name_label">チャンネル名(小文字・記号は - に変換されます)</label>
        <input id="newChannelName" placeholder="alerts">
      </div>
      <div class="field">
        <label data-i18n="addch.topic_label">トピック(任意)</label>
        <input id="newChannelTopic" placeholder="サーバー監視アラート" data-i18n-ph="addch.topic_ph">
      </div>
      <div class="row" style="justify-content:flex-end">
        <button class="ghost" data-close-modal data-i18n="common.cancel">キャンセル</button>
        <button id="createChannelBtn" data-i18n="common.create">作成</button>
      </div>
    </div>
  </div>

  <!-- チャンネル作成完了モーダル(自動発行された Webhook URL を即表示) -->
  <div id="createdModal" class="modal-bg hidden">
    <div class="modal">
      <h2 id="createdTitle"></h2>
      <p class="muted" data-i18n="created.desc">このチャンネル宛の Webhook URL を発行しました。送信元サービスの Discord Webhook 先に貼り付けてください。</p>
      <div class="url" id="createdUrl"></div>
      <div class="row">
        <button id="createdCopyBtn" data-i18n="created.copy">URL をコピー</button>
        <span class="grow"></span>
        <button class="ghost" data-close-modal data-i18n="common.close">閉じる</button>
      </div>
    </div>
  </div>

  <!-- チャンネル設定モーダル -->
  <div id="settingsModal" class="modal-bg hidden">
    <div class="modal">
      <h2 id="setTitle"></h2>
      <div class="field">
        <label data-i18n="settings.name_label">チャンネル名</label>
        <input id="setName">
      </div>
      <div class="field">
        <label data-i18n="settings.topic_label">トピック</label>
        <input id="setTopic">
      </div>
      <div class="row" style="margin-bottom:18px">
        <button id="saveChannelBtn" data-i18n="common.save">保存</button>
        <span class="grow"></span>
        <button id="deleteChannelBtn" class="danger" data-i18n="settings.delete_channel">チャンネルを削除</button>
      </div>

      <h2>Webhook URL</h2>
      <p class="muted" data-i18n="settings.webhook_desc">このチャンネルに届くDiscord互換URLです。送信元サービスのWebhook先に貼り付けてください。</p>
      <div class="row" style="margin-bottom:8px">
        <input id="newWebhookName" class="grow" placeholder="用途名 (例: Grafana)" data-i18n-ph="settings.webhook_name_ph">
        <button id="createWebhookBtn" data-i18n="settings.webhook_create">発行</button>
      </div>
      <div id="webhookList"></div>

      <div class="row" style="margin-top:18px; justify-content:space-between">
        <button id="clearMessagesBtn" class="danger" data-i18n="settings.clear_history">このチャンネルの履歴を全削除</button>
        <button class="ghost" data-close-modal data-i18n="common.close">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 通知設定(下から出るボトムシート) -->
  <div id="notifSheet" class="modal-bg sheet-bg hidden">
    <div class="sheet">
      <div class="sheet-head">
        <h2 data-i18n="notif.settings">通知設定</h2>
        <span id="notifDotSheet" class="status off" data-i18n="notif.label">通知</span>
        <span class="grow"></span>
        <button class="ghost" data-close-modal data-i18n="common.close">閉じる</button>
      </div>
      <div id="pushGuide" class="push-guide hidden"></div>
      <div class="row" style="margin:12px 0">
        <button id="enableBtn" class="secondary grow" data-i18n="notif.enable">通知を有効化</button>
        <button id="disableBtn" class="secondary grow hidden" data-i18n="notif.disable">通知を無効化</button>
        <button id="testBtn" class="ghost" title="テスト通知を送信" data-i18n-title="notif.test">✈️ <span data-i18n="notif.test_label">テスト</span></button>
      </div>
      <label class="switch-row" for="soundToggle">
        <span>📢 <span data-i18n="notif.sound">通知音</span></span>
        <input type="checkbox" id="soundToggle" class="switch">
      </label>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
